<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>POD Scanner</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23E00028" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>'>
  <link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23E00028" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>'>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Hanuman:wght@400;700&family=Cormorant+Garamond:wght@600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --primary: #E00028;
      --primary-dark: #B30020;
      --bg: #F9F8F3;
      --dark: #2C2A26;
      --white: #FFFFFF;
      --border: #E6E2D3;
      --success: #10B981;
      --warning: #F59E0B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--dark);
      display: flex; flex-direction: column; height: 100vh; width: 100vw;
      overflow: hidden; overscroll-behavior-y: none;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    
    /* Setup Screen */
    #setupScreen {
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      height: 100%; padding: 2rem; background: var(--bg); text-align: center;
      position: absolute; inset: 0; z-index: 50;
    }
    #setupScreen h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--dark); }
    #setupScreen p { color: #64748B; margin-bottom: 2rem; font-size: 1rem; }
    #messengerNameInput {
      width: 100%; max-width: 400px; padding: 1rem; border: 2px solid var(--border); border-radius: 12px;
      font-size: 1.2rem; font-family: 'DM Sans', sans-serif; text-align: center;
      outline: none; transition: border-color 0.2s; -webkit-user-select: auto; user-select: auto;
      background: var(--white); appearance: none; color: var(--dark); cursor: pointer;
    }
    #messengerNameInput:focus { border-color: var(--primary); }
    .btn-big {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white; border: none; padding: 1rem 2rem; width: 100%; max-width: 400px; border-radius: 12px;
      font-size: 1.2rem; font-weight: 700; margin-top: 1.5rem; cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25); transition: transform 0.2s;
    }
    .btn-big:active { transform: scale(0.98); }
    
    /* Main Scanner Screen */
    #mainScreen {
      display: none; flex-direction: column; height: 100%; position: absolute; inset: 0;
    }
    header {
      padding: 1.5rem; display: flex; justify-content: space-between; align-items: center;
      background: var(--white); border-bottom: 1px solid var(--border);
    }
    .greeting { font-size: 1.1rem; font-weight: 700; color: var(--dark); }
    .logout-btn { color: #94A3B8; font-size: 0.85rem; background: none; border: none; font-weight: 600; padding: 0.5rem; cursor: pointer; }
    
    #offlineBanner {
      display: none;
      background: var(--warning); color: var(--dark); font-weight: 600;
      text-align: center; padding: 0.5rem; font-size: 0.9rem;
    }

    .scan-area {
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 2rem; background: #F1F5F9; position: relative;
    }
    
    #reader-container {
      width: 100%; max-width: 400px; aspect-ratio: 1/1; background: #000; border-radius: 24px;
      overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.15); display: none;
      position: relative;
    }
    #reader { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; border-radius: 24px; }
    
    .tap-to-scan {
      width: 200px; height: 200px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: white; box-shadow: 0 16px 40px rgba(224, 0, 40, 0.3);
      cursor: pointer; transition: transform 0.2s; animation: pulse 2s infinite;
    }
    .tap-to-scan:active { transform: scale(0.95); }
    .tap-to-scan svg { width: 64px; height: 64px; margin-bottom: 0.5rem; }
    .tap-to-scan span { font-size: 1.2rem; font-weight: 700; }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(224, 0, 40, 0.4); }
      70% { box-shadow: 0 0 0 30px rgba(224, 0, 40, 0); }
      100% { box-shadow: 0 0 0 0 rgba(224, 0, 40, 0); }
    }
    
    .cancel-btn {
      display: none; margin-top: 2rem; background: var(--white); border: 1px solid var(--border);
      padding: 0.8rem 2rem; border-radius: 99px; font-weight: 600; color: #64748B; cursor: pointer;
    }
    
    /* Overlay Success */
    #successOverlay {
      position: absolute; inset: 0; background: var(--success); z-index: 100;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: white; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    #successOverlay.show { opacity: 1; pointer-events: auto; }
    #successOverlay svg { width: 120px; height: 120px; margin-bottom: 1rem; }
    #successOverlay h2 { font-size: 2rem; font-weight: 700; }
    
    /* Toast */
    .toast {
      position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
      background: var(--dark); color: white; padding: 0.8rem 1.5rem; border-radius: 99px;
      font-weight: 600; transition: bottom 0.4s; z-index: 200; white-space: nowrap;
    }
    .toast.show { bottom: max(2rem, env(safe-area-inset-bottom, 2rem)); }
  </style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setupScreen">
  <div style="margin-bottom: 1.5rem;">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--primary)"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
  </div>
  <h1>Welcome, Messenger</h1>
  <p>Please select your name to start delivering.</p>
  <select id="messengerNameInput">
    <option value="">Loading names...</option>
  </select>
  <button class="btn-big" onclick="saveName()">Let's Go</button>
</div>

<!-- MAIN SCREEN -->
<div id="mainScreen">
  <header>
    <div class="greeting" id="greetingText">Hello</div>
    <button class="logout-btn" onclick="logout()">Change Name</button>
  </header>
  
  <div id="offlineBanner">
    Offline Mode: Scans will be saved locally and sent when you reconnect.
  </div>
  
  <div class="scan-area">
    <!-- Big Button -->
    <div class="tap-to-scan" id="btnStartScan" onclick="startScanner()">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      <span>Tap to Scan</span>
    </div>
    
    <!-- Camera View -->
    <div id="reader-container">
      <div id="reader"></div>
    </div>
    <button class="cancel-btn" id="btnCancelScan" onclick="stopScanner()">Cancel</button>
  </div>
</div>

<!-- SUCCESS OVERLAY -->
<div id="successOverlay">
  <svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
  <h2>Delivered!</h2>
  <p id="successId" style="margin-top: 0.5rem; opacity: 0.9; font-family: monospace;"></p>
</div>

<div class="toast" id="toast">Message</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwq1lBS0jKE7cnnk72tgoJGiF6mk0FwQ0F9QSAIr3RuBPT5j65faYaex7THuJYfjyvrCw/exec"; 
  
  let messengerName = localStorage.getItem('messengerName') || '';
  
  // Secret Device ID Generation
  let deviceId = localStorage.getItem('__deviceId');
  if(!deviceId) {
    deviceId = 'dev_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now().toString(36);
    localStorage.setItem('__deviceId', deviceId);
  }
  
  let html5QrcodeScanner = null;
  let isScanning = false;
  
  // Offline Queue State
  let offlineQueue = JSON.parse(localStorage.getItem('offlineQueue') || '[]');
  
  // Init
  if(messengerName) {
    showMainScreen();
  } else {
    fetchMessengers();
  }

  // Event Listeners for Offline Mode
  window.addEventListener('online', updateNetworkStatus);
  window.addEventListener('offline', updateNetworkStatus);
  updateNetworkStatus();

  function updateNetworkStatus() {
    const banner = document.getElementById('offlineBanner');
    if (navigator.onLine) {
      banner.style.display = 'none';
      syncOfflineQueue();
    } else {
      banner.style.display = 'block';
    }
  }

  async function syncOfflineQueue() {
    if (offlineQueue.length === 0) return;
    
    showToast(`Syncing ${offlineQueue.length} pending scans...`);
    let syncedCount = 0;
    
    // Copy the queue so we don't manipulate it while iterating
    const currentQueue = [...offlineQueue];
    
    for (const scan of currentQueue) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ 
            action: 'markDelivered', 
            id: scan.id, 
            messengerName: scan.messengerName,
            deviceId: scan.deviceId,
            timestamp: scan.timestamp
          })
        });
        const json = await res.json();
        if (json.success || json.message === 'Already delivered') {
          // Remove from original queue
          offlineQueue = offlineQueue.filter(q => q.id !== scan.id);
          localStorage.setItem('offlineQueue', JSON.stringify(offlineQueue));
          syncedCount++;
        }
      } catch (e) {
        // If network fails during sync, stop syncing
        break;
      }
    }
    
    if (syncedCount > 0) {
      showToast(`Successfully synced ${syncedCount} scans!`);
    }
  }
  
  async function fetchMessengers() {
    if (!navigator.onLine) {
      document.getElementById('messengerNameInput').innerHTML = '<option value="">Cannot load names while offline</option>';
      return;
    }
    try {
      const res = await fetch(API_URL + "?action=getMessengers");
      const json = await res.json();
      if(json.success) {
        const select = document.getElementById('messengerNameInput');
        select.innerHTML = '<option value="">Select your name...</option>';
        json.data.forEach(name => {
          select.innerHTML += `<option value="${name}">${name}</option>`;
        });
      }
    } catch(e) {
      document.getElementById('messengerNameInput').innerHTML = '<option value="">Error loading names</option>';
    }
  }
  
  function saveName() {
    const name = document.getElementById('messengerNameInput').value.trim();
    if(!name) { showToast("Please select your name"); return; }
    messengerName = name;
    localStorage.setItem('messengerName', messengerName);
    showMainScreen();
  }
  
  function logout() {
    localStorage.removeItem('messengerName');
    messengerName = '';
    document.getElementById('setupScreen').style.display = 'flex';
    document.getElementById('mainScreen').style.display = 'none';
    fetchMessengers();
  }
  
  function showMainScreen() {
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'flex';
    document.getElementById('greetingText').innerText = `Hello, ${messengerName}`;
    
    // Auto-start scanner
    setTimeout(() => {
      startScanner();
    }, 500); // Allow UI to render first
  }
  
  async function startScanner() {
    document.getElementById('btnStartScan').style.display = 'none';
    document.getElementById('reader-container').style.display = 'block';
    document.getElementById('btnCancelScan').style.display = 'block';
    
    if(!html5QrcodeScanner) {
      html5QrcodeScanner = new Html5Qrcode("reader");
    }
    
    try {
      await html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 280, height: 280 }, aspectRatio: 1.0 },
        onScanSuccess,
        onScanFailure
      );
      isScanning = true;
    } catch(err) {
      showToast("Error starting camera: " + err);
      resetScannerUI();
    }
  }
  
  async function stopScanner() {
    if(html5QrcodeScanner && isScanning) {
      try {
        await html5QrcodeScanner.stop();
      } catch (err) {
        console.error("Failed to stop scanner", err);
      }
    }
    isScanning = false;
    resetScannerUI();
  }
  
  async function onScanSuccess(decodedText) {
    if(!isScanning) return;
    
    // Stop scanning immediately on success
    isScanning = false;
    try {
      await html5QrcodeScanner.stop();
    } catch(err) {}
    
    showSuccessOverlay(decodedText);
    resetScannerUI();
    
    const payload = {
      id: decodedText,
      messengerName: messengerName,
      deviceId: deviceId,
      timestamp: new Date().toISOString()
    };

    if (!navigator.onLine) {
      queueOffline(payload);
      return;
    }
    
    // Show toast for online sending, though overlay is already shown
    showToast(`Sending: ${decodedText}...`);
    
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'markDelivered', ...payload })
      });
      const json = await res.json();
      
      if(!json.success && json.message !== 'Already delivered') {
        showToast('Error on server: ' + json.error);
        queueOffline(payload); // Queue it if server failed temporarily
      }
    } catch(e) {
      showToast('Network error, saving offline');
      queueOffline(payload);
    }
  }
  
  function queueOffline(payload) {
    // Check if already in queue
    if (!offlineQueue.some(item => item.id === payload.id)) {
      offlineQueue.push(payload);
      localStorage.setItem('offlineQueue', JSON.stringify(offlineQueue));
      showToast(`Saved offline: ${payload.id}`);
    }
  }

  function onScanFailure(error) { 
    // Ignore routine scan failures
  }
  
  function resetScannerUI() {
    document.getElementById('btnStartScan').style.display = 'flex';
    document.getElementById('reader-container').style.display = 'none';
    document.getElementById('btnCancelScan').style.display = 'none';
  }
  
  function showSuccessOverlay(id) {
    document.getElementById('successId').innerText = id;
    const overlay = document.getElementById('successOverlay');
    overlay.classList.add('show');
    
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]); // Haptic feedback success
    
    setTimeout(() => {
      overlay.classList.remove('show');
      // Auto-restart scanner for the next item
      startScanner();
    }, 2500);
  }
  
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
