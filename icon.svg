<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle glass gloss highlight -->
  <rect width="512" height="256" rx="112" fill="url(#shineGrad)"/>

  <!-- Calendar Container with Drop Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Calendar Body -->
    <rect x="96" y="112" width="320" height="310" rx="36" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Calendar Top Bar -->
    <path d="M 96 148 C 96 128 112 112 132 112 L 380 112 C 400 112 416 128 416 148 L 416 198 L 96 198 Z" fill="url(#headerGrad)"/>

    <!-- Calendar Rings / Hooks -->
    <rect x="160" y="86" width="24" height="52" rx="12" fill="#ffffff" filter="url(#innerShadow)"/>
    <rect x="328" y="86" width="24" height="52" rx="12" fill="#ffffff" filter="url(#innerShadow)"/>
    <circle cx="172" cy="98" r="4" fill="#dc2626"/>
    <circle cx="340" cy="98" r="4" fill="#dc2626"/>

    <!-- Calendar Grid Items / Check Emblem -->
    <!-- Grid dots -->
    <circle cx="162" cy="242" r="10" fill="#e2e8f0"/>
    <circle cx="218" cy="242" r="10" fill="#e2e8f0"/>
    <circle cx="274" cy="242" r="10" fill="#e2e8f0"/>
    <circle cx="330" cy="242" r="10" fill="#e2e8f0"/>

    <circle cx="162" cy="294" r="10" fill="#e2e8f0"/>
    <circle cx="218" cy="294" r="10" fill="#e2e8f0"/>
    
    <!-- Checkmark circle badge in lower right -->
    <circle cx="298" cy="326" r="62" fill="#dc2626" filter="url(#dropShadow)"/>
    <circle cx="298" cy="326" r="62" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M 270 326 L 290 346 L 330 304" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
